<!-- ===== Mobile layer: scroll petals + bottom nav + mobile polish ===== -->
<style>
#sp{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:44;pointer-events:none}
@media (max-width:760px){#sp{display:block}}

.bn{display:none}
@media (max-width:760px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bn{
    display:flex;position:fixed;left:12px;right:12px;width:auto!important;box-sizing:border-box;flex-wrap:nowrap!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:46;
    justify-content:space-between;gap:2px;padding:6px;border-radius:22px;
    background:rgba(14,16,30,.82);border:1px solid rgba(196,181,253,.22);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 14px 40px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
    transform:translateY(140%);opacity:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;
  }
  .bn.on{transform:none;opacity:1}
  body.dlg .bn{transform:translateY(140%);opacity:0;pointer-events:none}
  .bn button{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:50px;padding:6px 2px;border:0;border-radius:16px;background:none;cursor:pointer;
    color:rgba(255,255,255,.55);font:500 10px/1 var(--font-sans,system-ui);letter-spacing:.06em;
    -webkit-tap-highlight-color:transparent;transition:color .25s,background .25s;
  }
  .bn button::after{display:none!important}
  .bn button{white-space:nowrap}
  .bn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
  .bn button[aria-current="true"]{color:#fff;background:linear-gradient(160deg,rgba(196,181,253,.28),rgba(255,179,217,.14))}
  .bn button[aria-current="true"] svg{transform:translateY(-1px) scale(1.08);stroke:#e2d4ff}
  .bn button:active{background:rgba(255,255,255,.08)}

  h1{font-size:clamp(34px,10.4vw,46px)!important;line-height:1.06!important}
  .eyebrow{line-height:1.7}
  .cta{width:100%;max-width:340px;justify-content:space-between;min-height:56px}

  .zb{grid-template-columns:1fr!important;justify-items:center;gap:10px!important}
  .zb .brand,.zb .so{justify-self:center!important}
  .zb nav ul{display:grid!important;grid-template-columns:repeat(3,auto);justify-content:center;gap:2px 26px!important}
  .zb .so{display:flex;gap:20px!important}
  .zb .lk,.zb a{min-height:44px;display:inline-flex;align-items:center;justify-content:center}

  .sx{padding-left:20px!important;padding-right:20px!important}
  .sh .sl{font-size:14px;line-height:1.7}
  .rb{flex:1;justify-content:center}
  .ra{width:100%}
}
@media (prefers-reduced-motion:reduce){.bn{transition:none}}
</style>

<canvas id="sp" aria-hidden="true"></canvas>

<nav class="bn" id="bn" aria-label="Quick navigation">
  <button type="button" data-t="top" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button type="button" data-t="process" aria-label="Process"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="6" cy="18" r="2.2"/><path d="M8 7l8 4M8 17l8-4"/></svg>Process</button>
  <button type="button" data-t="works" aria-label="Work"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>Work</button>
  <button type="button" data-t="resume" aria-label="Resume"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Resume</button>
  <button type="button" data-t="contact" aria-label="Contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>Contact</button>
</nav>

<script>
(function(){
  /* ---------- 1. petals that fall as you scroll (phones only) ---------- */
  var cv=document.getElementById('sp'); if(!cv) return;
  var cx=cv.getContext('2d'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,dpr=1,P=[],raf=0,last=0,lastY=window.scrollY,acc=0,MAX=reduce?12:28;
  var COLORS=[['#ffd1e6','#ff9fc8'],['#ffe0ef','#ffb3d9'],['#f1e6ff','#c4b5fd'],['#ffe9d6','#ffb98a'],['#fff0f6','#ffc2dc']];
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  size(); addEventListener('resize',size);

  function spawn(boost){
    if(P.length>=MAX) return;
    var c=COLORS[(Math.random()*COLORS.length)|0], s=7+Math.random()*9;
    P.push({
      x:Math.random()*(W+60)-30, y:-24-Math.random()*40,
      vy:(46+Math.random()*60)+boost*.12, vx:(Math.random()-.4)*22,
      s:s, rot:Math.random()*6.28, vr:(Math.random()-.5)*2.2,
      ph:Math.random()*6.28, sw:.9+Math.random()*1.3, amp:14+Math.random()*26,
      flip:Math.random()*6.28, vf:1.4+Math.random()*2.2,
      c0:c[0], c1:c[1], a:.0, life:0, kind:Math.random()<.18?1:0
    });
  }
  function petal(p){
    var L=p.s, fy=.35+.65*Math.abs(Math.cos(p.flip));
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.scale(fy,1);
    var g=cx.createLinearGradient(0,-L,0,L); g.addColorStop(0,p.c0); g.addColorStop(1,p.c1);
    cx.fillStyle=g; cx.globalAlpha=p.a*.88;
    cx.shadowColor='rgba(255,170,210,.55)'; cx.shadowBlur=8;
    cx.beginPath();
    if(p.kind){
      cx.moveTo(0,L); cx.bezierCurveTo(L*.95,L*.5,L*.8,-L*.7,L*.14,-L*.92);
      cx.lineTo(0,-L*.7); cx.lineTo(-L*.14,-L*.92);
      cx.bezierCurveTo(-L*.8,-L*.7,-L*.95,L*.5,0,L);
    } else {
      cx.moveTo(0,-L); cx.bezierCurveTo(L*.9,-L*.35,L*.7,L*.8,0,L);
      cx.bezierCurveTo(-L*.7,L*.8,-L*.9,-L*.35,0,-L);
    }
    cx.fill(); cx.shadowBlur=0;
    cx.globalAlpha=p.a*.35; cx.strokeStyle='#fff'; cx.lineWidth=.7;
    cx.beginPath(); cx.moveTo(0,-L*.6); cx.lineTo(0,L*.7); cx.stroke();
    cx.restore();
  }
  function tick(t){
    var dt=Math.min(.05,(t-last)/1000||.016); last=t;
    cx.clearRect(0,0,W,H);
    for(var i=P.length-1;i>=0;i--){
      var p=P[i];
      p.life+=dt; p.ph+=p.sw*dt; p.rot+=p.vr*dt; p.flip+=p.vf*dt;
      p.y+=p.vy*dt; p.x+=(p.vx+Math.cos(p.ph)*p.amp)*dt;
      p.a=Math.min(1,p.life*2.2)*(p.y>H-90?Math.max(0,(H-p.y)/90):1);
      if(p.y>H+30||p.x<-60||p.x>W+60){P.splice(i,1);continue}
      petal(p);
    }
    raf=P.length?requestAnimationFrame(tick):0;
    if(!raf) cx.clearRect(0,0,W,H);
  }
  function wake(){ if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); } }

  var ticking=false;
  var phone=matchMedia('(max-width:760px)');
  function onScroll(){
    if(!phone.matches){ P.length=0; lastY=window.scrollY; return; }
    var y=window.scrollY, d=Math.abs(y-lastY); lastY=y;
    acc+=d/(reduce?220:110);
    var n=Math.min(3,acc|0); acc-=n;
    for(var i=0;i<n;i++) spawn(Math.min(d*6,420));
    if(P.length) wake();
  }
  addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(function(){ticking=false;onScroll()})} },{passive:true});
  document.addEventListener('visibilitychange',function(){ if(document.hidden){P.length=0} });

  /* ---------- 2. bottom nav ---------- */
  var bn=document.getElementById('bn'), btns=[].slice.call(bn.querySelectorAll('button'));
  function setActive(k){ btns.forEach(function(b){ b.setAttribute('aria-current', b.dataset.t===k?'true':'false'); }); }
  function currentSection(){
    var mid=innerHeight*.45, order=['contact','resume','lab','works','process','stage'], best='top';
    for(var i=0;i<order.length;i++){
      var el=document.getElementById(order[i]); if(!el) continue;
      var r=el.getBoundingClientRect();
      if(r.top<=mid){ best=order[i]; break; }
    }
    return best==='stage'?'top':(best==='lab'?'works':best);
  }
  function syncNav(){
    bn.classList.toggle('on', scrollY>innerHeight*.55);
    setActive(currentSection());
  }
  addEventListener('scroll',function(){requestAnimationFrame(syncNav)},{passive:true});
  addEventListener('resize',syncNav); syncNav();

  btns.forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.t, beh=reduce?'auto':'smooth';
      if(k==='top') scrollTo({top:0,behavior:beh});
      else { var el=document.getElementById(k); if(el) el.scrollIntoView({behavior:beh,block:'start'}); }
    });
  });

  var ov=[].slice.call(document.querySelectorAll('.overlay'));
  function dlg(){ document.body.classList.toggle('dlg', ov.some(function(o){return !o.hidden})); }
  ov.forEach(function(o){ new MutationObserver(dlg).observe(o,{attributes:true,attributeFilter:['hidden']}); });

  if(matchMedia('(hover:none)').matches){
    var s=document.querySelector('#scrollBtn span:last-child'); if(s) s.textContent='Swipe up to explore';
  }
})();
</script>
